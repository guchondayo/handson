<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Sphere with Phong Shading</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
</head>
<body>
<canvas id="glCanvas"></canvas>
<style>
    #glCanvas {
        width: 100vw;
        height: 100vh;
        background-color: black;
    }
</style>
<script>
const canvas = document.getElementById("glCanvas");
const gl = canvas.getContext('webgl');

// キャンバスサイズとビューポート設定
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
gl.viewport(0, 0, canvas.width, canvas.height);
gl.clearColor(0.0, 0.0, 0.0, 1.0); // 黒でクリア
gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

// シェーダのコンパイル
const toMakeshader = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error("Error compiling shader", gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
    }
    return shader;
};

const roundShaderSource = `
attribute vec3 a_position;
attribute vec4 a_color;
varying vec4 v_color;
uniform mat4 u_modelMatrix;
uniform mat4 u_viewMatrix;
uniform mat4 u_projectionMatrix;
void main(void) {
    gl_Position = u_projectionMatrix * u_viewMatrix * u_modelMatrix * vec4(a_position, 1.0);
    v_color = a_color;
}
`;

const fragmentShaderSource = `
precision mediump float;
varying vec4 v_color;
void main(void) {
   gl_FragColor = v_color;
}
`;

const roundVertexShader = toMakeshader(gl.VERTEX_SHADER, roundShaderSource);
const roundFragmentShader = toMakeshader(gl.FRAGMENT_SHADER, fragmentShaderSource);

// プログラムのリンク
const toMakeProgram = (vertex, fragment) => {
    const program = gl.createProgram();
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('Failed to link program:', gl.getProgramInfoLog(program));
        gl.deleteProgram(program);
        return null;
    }
    gl.useProgram(program);
    return program;
};

const roundProgram = toMakeProgram(roundVertexShader, roundFragmentShader);

// バッファの設定
const roundBuffer = (type, array) => {
    const buffer = gl.createBuffer();
    gl.bindBuffer(type, buffer);
    gl.bufferData(type, array, gl.STATIC_DRAW);
    return buffer;
};

// 頂点データの生成
const radius = 10.0;
const longitudeBands = 30;
const latitudeBands = 30;
const vertices = [];
const indices = [];
const colors = [];

for (let latNumber = 0; latNumber <= latitudeBands; latNumber++) {
    const theta = latNumber * Math.PI / latitudeBands - Math.PI / 2;
    const sinTheta = Math.sin(theta);
    const cosTheta = Math.cos(theta);

    for (let longNumber = 0; longNumber <= longitudeBands; longNumber++) {
        const phi = longNumber * 2 * Math.PI / longitudeBands;
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);

        const x = radius * cosPhi * sinTheta;
        const y = radius * cosTheta;
        const z = radius * sinPhi * sinTheta;

        vertices.push(x, y, z);
        colors.push(1.0, 1.0, 0.0, 1.0); // 黄色
    }
}

for (let latNumber = 0; latNumber < latitudeBands; latNumber++) {
    for (let longNumber = 0; longNumber < longitudeBands; longNumber++) {
        const first = (latNumber * (longitudeBands + 1)) + longNumber;
        const second = first + longitudeBands + 1;

        indices.push(first, second, first + 1);
        indices.push(second, second + 1, first + 1);
    }
}

const vertexBuffer = roundBuffer(gl.ARRAY_BUFFER, new Float32Array(vertices));
const colorBuffer = roundBuffer(gl.ARRAY_BUFFER, new Float32Array(colors));
const indexBuffer = roundBuffer(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices));

// 頂点属性を設定
const positionLocation = gl.getAttribLocation(roundProgram, 'a_position');
gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
gl.vertexAttribPointer(positionLocation, 3, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(positionLocation);

const colorLocation = gl.getAttribLocation(roundProgram, 'a_color');
gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
gl.vertexAttribPointer(colorLocation, 4, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(colorLocation);

// 行列の生成
const modelMatrix = mat4.create();
const viewMatrix = toMakeViewMatrix([0, 0, 30], [0, 0, 0], [0, 1, 0]);  // カメラを球体からさらに後ろに移動
const projectionMatrix = mat4.perspective(mat4.create(), Math.PI / 4, canvas.width / canvas.height, 0.1, 100);

// 行列を送信
gl.uniformMatrix4fv(gl.getUniformLocation(roundProgram, 'u_modelMatrix'), false, modelMatrix);
gl.uniformMatrix4fv(gl.getUniformLocation(roundProgram, 'u_viewMatrix'), false, viewMatrix);
gl.uniformMatrix4fv(gl.getUniformLocation(roundProgram, 'u_projectionMatrix'), false, projectionMatrix);

// 描画
gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
</script>
</body>
</html>
