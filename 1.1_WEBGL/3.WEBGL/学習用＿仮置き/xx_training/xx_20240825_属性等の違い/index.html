<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Example</title>
    <!-- gl-matrixライブラリのインポート -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
</head>
<body>
<canvas id="glCanvas"></canvas>
<script>
    const canvas = document.getElementById('glCanvas');
    const gl = canvas.getContext('webgl');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);

    // 頂点シェーダー
    const vertexShaderSource = `
    attribute vec3 a_position;        // 属性：頂点の位置データ
    attribute vec3 a_color;           // 属性：頂点の色データ
    uniform mat4 u_matrix;            // ユニフォーム：変換行列
    varying vec3 v_color;             // varying変数：フラグメントシェーダーに渡す色データ
    const float scale = 0.5;          // 定数：スケール（固定された値）

    void main(void) {
        gl_Position = u_matrix * vec4(a_position * scale, 1.0); // 変換行列とスケールを適用した頂点位置
        v_color = a_color;                                      // varying変数に色データを渡す
    }
    `;

    // フラグメントシェーダー
    const fragmentShaderSource = `
    precision mediump float;
    varying vec3 v_color;             // varying変数：頂点シェーダーから渡された色データ

    void main(void) {
        gl_FragColor = vec4(v_color, 1.0);  // 色をフラグメントの色として設定
    }
    `;
    // 問1：フラグメントシェーダから直接配列は流し込める？またその理由？
    // できない。どの色がどの頂点かわからんやん。フラグメントシェーダに直接バッファを渡すことができた場合、頂点データとの整合性が失われる可能性があります。
    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, vertexShaderSource);
    gl.compileShader(vertexShader);

    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, fragmentShaderSource);
    gl.compileShader(fragmentShader);

    const shaderProgram = gl.createProgram();
    gl.attachShader(shaderProgram, vertexShader);
    gl.attachShader(shaderProgram, fragmentShader);
    gl.linkProgram(shaderProgram);
    gl.useProgram(shaderProgram);

    // 頂点データ
    // 問2：頂点に色を付ける方法を２つ答えてください
        // 1.同じ配列に色データもくわ得てしまう
        // 2.色データも別配列で作ってしまい、バインドしてしまう
    const vertices = new Float32Array([

        // 位置(x, y, z)   色(r, g, b)
        0.0,  0.5,  0.0,   1.0, 0.0, 0.0,  // 上の頂点（赤）
        -0.5, -0.5, 0.0,   0.0, 1.0, 0.0,  // 左下の頂点（緑）
        0.5, -0.5,  0.0,   0.0, 0.0, 1.0   // 右下の頂点（青）
    ]);

    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
    //問3もしカラーが別だった場合、書き方の違いを答えてください
    //＊重要＊＊
    // どの頂点がどのカラーなのかは『直前にバインドされた頂点バッファ』が対象です！
    // 以下の第5引数は間隔（3つの空きがひつよう）
    // 第6引数はスタート位置です
    // gl.vertexAttribPointer(a_color, 3, gl.FLOAT, false, 6 * 4, 3 * 4);
    //　もし同じ配列に色と頂点を混ぜた場合、ここをバイト数で入力しないとだめになる
    // 頂点属性：位置
    const a_position = gl.getAttribLocation(shaderProgram, 'a_posiition')
    gl.vertexAttribPointer(a_position, 3, gl.FLOAT, false, 6 * 4, 0);
    gl.enableVertexAttribArray(a_position);

    // 頂点属性：色
    const a_color = gl.getAttribLocation(shaderProgram, 'a_color');
    gl.vertexAttribPointer(a_color, 3, gl.FLOAT, false, 6 * 4, 3 * 4);
    gl.enableVertexAttribArray(a_color);

    // ユニフォーム：変換行列
    const u_matrix = gl.getUniformLocation(shaderProgram, 'u_matrix');
    const matrix = mat4.create();  // 単位行列を作成
    mat4.translate(matrix, matrix, [0.0, 0.0, -2.0]);  // Z軸方向に移動
    gl.uniformMatrix4fv(u_matrix, false, matrix);

    // 描画
    gl.clearColor(0.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body>
</html>
